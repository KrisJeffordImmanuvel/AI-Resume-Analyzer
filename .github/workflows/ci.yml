# Checks every pull request (and every push to main) on Windows, like the app's users:
# backend tests and Ruff, frontend ESLint and build.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (tests, Ruff)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install packages
        run: python -m pip install -r requirements-dev.txt
      - name: Ruff (lint)
        run: ruff check .
      - name: Ruff (formatting)
        run: ruff format --check .
      - name: Tests
        run: python -m pytest

  frontend:
    name: Frontend (ESLint, build)
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install packages
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Build
        run: npm run build
