# Database migrations (Alembic). The app applies them automatically when it starts.
# Only needed by developers who change models.py, from the backend folder:
#   alembic revision --autogenerate -m "describe the change"
# The database address comes from the app settings (DATABASE_URL / backend\.env).
[alembic]
script_location = migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
