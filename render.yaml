# Render Blueprint: publishes Truescope as a private website (one password), on the free plan.
# Your data is kept in a free Neon Postgres database (DATABASE_URL), because a free Render
# service has no disk and forgets its files whenever it sleeps or updates.
# In Render: New > Blueprint, pick this repository. See README, "Publish on Render".
services:
  - type: web
    name: truescope
    runtime: docker
    plan: free # sleeps after about 15 minutes without visitors; the next visit wakes it (about 1 minute)
    branch: main
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      # The password for the site. You type it in Render when you create the service.
      - key: APP_PASSWORD
        sync: false
      # Your Neon database address (starts with postgresql://). You paste it in Render.
      - key: DATABASE_URL
        sync: false
      # Refuse to start without a strong APP_PASSWORD (12+ characters).
      - key: REQUIRE_PASSWORD
        value: "true"
      # Signs the sign-in cookie. Render makes a random value.
      - key: SESSION_SECRET
        generateValue: true
      # Optional. Your Gemini API key; leave blank for the built-in rules only.
      - key: GOOGLE_API_KEY
        sync: false
      - key: GEMINI_FALLBACK_MODELS
        sync: false
